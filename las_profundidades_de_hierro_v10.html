a-inset-top));padding:calc(8px + env(safe-area-inset-top)) 8px 7px;display:flex;gap:6px;background:#152128;border-bottom:1px solid var(--line);z-index:8}.stat{flex:1;min-width:0;padding:5px 7px;border:1px solid #43545b;background:#172127;color:#aab5ad;font:10px Arial}.stat b{display:block;color:var(--gold);font:700 15px Georgia;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.stat.depth b{font-size:13px;color:#69d8d0}.scene{position:relative;flex:1;overflow:hidden;background:radial-gradient(ellipse at 50% 30%,#405159,#18242a 45%,#0b1115 84%)}.rock{position:absolute;inset:0;background:repeating-linear-gradient(130deg,#26353c 0 35px,#1e2b31 36px 74px,#2b3940 75px 111px)}.wall{position:absolute;z-index:3;top:17%;left:12%;width:76%;height:61%;display:grid;gap:3px}.block{min-width:0;min-height:0;position:relative;padding:0;overflow:hidden;background:linear-gradient(135deg,#596870,#2b373d 45%,#1a242a);border:1px solid #76848a;clip-path:polygon(8% 2%,85% 0,100% 16%,96% 86%,78% 100%,13% 96%,0 75%,3% 20%)}.gem{position:absolute;inset:12%;filter:drop-shadow(0 0 4px var(--glow))}.crack{position:absolute;inset:0;opacity:0;background:linear-gradient(59deg,transparent 45%,#080b0d 47% 51%,transparent 53%),linear-gradient(136deg,transparent 52%,#080b0d 54% 57%,transparent 59%)}.block[data-s="1"] .crack,.block[data-s="2"] .crack,.block[data-s="3"] .crack{opacity:.8}.empty{background:radial-gradient(ellipse,#050708,#10181c 55%,#2a373c 64%)!important;pointer-events:none}.tag{position:absolute;z-index:5;right:9px;top:2%;padding:7px;background:#11191de8;border:1px solid #58686d;text-align:center;font:10px Arial}.tag b{display:block;color:#6cddd3;font:18px Georgia}.floor{position:absolute;bottom:0;width:100%;height:25%;background:linear-gradient(155deg,#0d1418,#33434a,#10171a)}.dock{position:absolute;z-index:12;bottom:77px;left:50%;width:65%;transform:translateX(-50%);padding:12px;background:linear-gradient(#a6633b,#59321f);border:1px solid #e2a66d;border-radius:7px;letter-spacing:2px;font-size:12px}.nav{height:calc(76px + env(safe-area-inset-bottom));display:flex;padding:5px calc(3px + env(safe-area-inset-right)) calc(5px + env(safe-area-inset-bottom)) calc(3px + env(safe-area-inset-left));background:#10181d;border-top:1px solid #4b5a60;z-index:10}.nav button{flex:1;background:none;color:#9eaaa5;font:9px Arial}.nav .active{color:#e8bb68}.ico{display:block;width:23px;height:23px;margin:auto;fill:none;stroke:currentColor;stroke-width:1.7}.float{position:absolute;z-index:16;pointer-events:none;font:bold 13px Georgia;text-shadow:0 2px #000;animation:up .7s forwards}@keyframes up{to{transform:translateY(-36px);opacity:0}}.panel{z-index:20;bottom:76px;flex-direction:column;background:linear-gradient(145deg,#18242a,#0a1014)}.head{padding:15px;background:#1d292f;border-bottom:1px solid #536269}.head h2{margin:0;color:#e2bf7c;font-size:22px}.head p{margin:4px 0 0;color:#a6aea7;font:12px Arial}.body{padding:12px;overflow:auto}.card,.upgrade,.cap,.slot,.item{padding:10px;margin-bottom:7px;background:#172228;border:1px solid #43535a}.bar{height:7px;background:#05080a;margin-top:7px}.bar i{display:block;height:100%;background:linear-gradient(90deg,#a85d37,#e5b765)}.card{display:flex;align-items:center;gap:9px;border-left:3px solid var(--c)}.minicon{width:40px;height:40px;flex:none}.minicon svg{width:100%;height:100%}.name{flex:1}.card small,.upgrade p,.slot small,.item small{display:block;margin:3px 0;color:#aab3ac;font:11px Arial}.value{text-align:right;color:#ebc06e;font-size:13px}.tabs{display:flex;gap:6px;margin-bottom:10px}.tab{flex:1;padding:10px 2px;background:#182329;border:1px solid #48575d;font-size:10px}.tab.active{color:#edc878;border-color:#b87c46;background:#312b22}.hero{padding:15px;margin-bottom:10px;background:linear-gradient(110deg,#3b251d,#192429);border:1px solid #8c6245}.hero h3,.upgrade h3{margin:0;color:#f0ca7b}.hero p{font:12px Arial;line-height:1.4}.sell,.buy,.equip{padding:9px;background:linear-gradient(#a6673e,#59321f);border:1px solid #e0a26b;font-size:11px}.mrow{display:flex;gap:6px;align-items:center}.mrow .card{flex:1}.uf{display:flex;justify-content:space-between;align-items:center;color:#e7bb69;font:12px Arial}.slots{display:grid;grid-template-columns:1fr 1fr;gap:7px}.slot{margin:0;min-height:65px;border-left:4px solid var(--r)}.slot h3{margin:0;color:var(--r);font-size:13px}.miner{display:block;width:150px;height:170px;margin:0 auto 10px}.item{border-left:4px solid var(--r)}.item b{color:var(--r)}.equip{margin-top:5px;padding:6px;width:100%;background:#29373d;border-color:#5a6b70}.empty{text-align:center;padding:35px 10px;color:#abb3ac;font:13px Arial}.modal{z-index:40;align-items:center;padding:20px;background:#000a}.dialog{width:100%;padding:18px;background:#1a252b;border:1px solid #a77d56}.dialog h3{margin:0;color:#edc67b}.dialog p{font:13px Arial;line-height:1.4}.actions{display:flex;gap:7px;margin-top:12px}.actions button{flex:1;padding:10px;background:#26343a;border:1px solid #53636a}.actions .danger{background:#743d2d}</style></head><body><div id="app"><section id="menu" class="screen on"><i class="portal"></i><div class="log"><small>CRÓNICAS DE LA MONTAÑA HUECA</small><h1>LAS PROFUNDIDADES<span>DE HIERRO</span></h1></div><div class="menuBox"><button id="continue" class="primary"></button><div class="row"><button id="new">NUEVA PARTIDA</button><button id="settings">AJUSTES</button><button id="credits">CRÉDITOS</button></div></div><i class="version">v10.0 · Guardado local</i></section><section id="game" class="screen"><header class="hud"><div class="stat">MONEDAS<b id="coins">0</b></div><div class="stat">CARGA<b id="load">0 / 20</b></div><div class="stat depth">PROFUNDIDAD<b id="depth">0 m · Estrato I</b></div></header><main id="scene" class="scene"><i class="rock"></i><div class="tag">DESCENSO<b id="tag">0 m</b>Veta agotada: +1 m</div><div class="floor"></div><div id="wall" class="wall"></div></main><button id="dock" class="dock">MERCADO</button><nav id="nav" class="nav"></nav></section><section id="bag" class="panel"><div class="head"><h2>Mochila de campaña</h2></div><div id="bagbody" class="body"></div></section><section id="codex" class="panel"><div class="head"><h2>Códice de profundidades</h2></div><div id="codexbody" class="body"></div></section><section id="miner" class="panel"><div class="head"><h2>El minero del pozo</h2></div><div id="minerbody" class="body"></div></section><section id="market" class="panel"><div class="head"><h2>Mercado del pozo</h2><p>Monedas disponibles: <b id="marketcoins">0</b></p></div><div class="body"><div class="tabs"><button class="tab" data-tab="sell">VENTA</button><button class="tab" data-tab="tools">HERRAMIENTAS</button><button class="tab" data-tab="workshop">TALLER</button></div><div id="marketbody"></div></div></section><div id="modal" class="modal"><div id="dialog" class="dialog"></div></div></div><script>(function(){var $=id=>document.getElementById(id),K='profundidades_v10',O={stone:['Piedra','#929b9d','#e0e4de',1,2],coal:['Carbón','#202a2e','#748990',3,3],copper:['Cobre','#c77849','#efa16c',7,4]};var gear=[['casco','Casco del veterano','común','+1% botín','loot',1],['pico','Pico de cobre','raro','+1 daño','damage',1],['traje','Traje de lona','común','+2 capacidad','bag',2],['botas','Botas de raíles','raro','+2% velocidad','speed',2],['talismán','Talismán de veta','épico','+3% valor','value',3]],colors={común:'#b8c1bd',raro:'#66bde4',épico:'#b881e8',legendario:'#efba56'};function base(){return{v:10,coins:0,bag:{},pick:1,baglvl:1,prospect:25,mine:4,depth:0,active:'mine',market:'sell',items:[],equip:{casco:null,pico:null,traje:null,botas:null,talismán:null}}}function mig(x){var d=base(),t=x&&x.tools||{};return{v:10,coins:+(x&&x.coins)||0,bag:x&&x.bag||{},pick:+(x&&x.pick)||+t.pick||1,baglvl:+(x&&x.baglvl)||+t.bag||1,prospect:Math.max(25,Math.min(100,+x&&x.prospect||25)),mine:Math.max(4,Math.min(12,+x&&x.mine||4)),depth:+(x&&x.depth)||+(x&&x.meters)||0,active:'mine',market:x&&x.market||'sell',items:x&&x.items||[],equip:Object.assign(d.equip,x&&x.equip||{})}}var S;try{S=JSON.parse(localStorage.getItem(K))}catch(e){}if(S)S=mig(S);function save(){localStorage.setItem(K,JSON.stringify(S))}function cap(){return 20+(S.baglvl-1)*12+bonus('bag')}function load(){return Object.keys(S.bag).reduce((a,k)=>a+S.bag[k],0)}function bonus(t){return Object.keys(S.equip).reduce((a,k)=>S.equip[k]&&S.equip[k][4]===t?a+S.equip[k][5]:a,0)}function svg(k){var m=O[k];return'<svg viewBox="0 0 40 42">'+(k==='coal'?'<path d="M5 14 14 5l10 5 11 12-7 13-14 2-9-10z" fill="#10181d" stroke="#748990"/><path d="M12 15l7-6 4 17m-10-3 13 4" stroke="#9facad" stroke-width="1.4" fill="none"/>':'<path d="M20 2 33 13 28 34 18 40 7 28 8 12z" fill="'+m[1]+'" stroke="'+m[2]+'" stroke-width="1.5"/><path d="M20 4 18 38M9 13l19 20M32 14 8 28" stroke="#fff" stroke-opacity=".34" stroke-width="1.5"/>')+'</svg>'}function ico(t){var p={mine:'M4 19h16M7 19l2-8h6l2 8M10 11V6h4v5',bag:'M5 8h14l1 12H4L5 8zm4 0V5h6v3',book:'M4 5c4-2 7 0 8 2 1-2 4-4 8-2v14c-4-2-7 0-8 2-1-2-4-4-8-2V5zM12 7v14',miner:'M8 8c0-5 8-5 8 0v4h2v8H6v-8h2V8zm2 0v4h4V8'};return'<svg class="ico" viewBox="0 0 24 24"><path d="'+p[t]+'"/></svg>'}function hud(){$('coins').textContent=S.coins;$('load').textContent=load()+' / '+cap();$('depth').textContent=S.depth+' m · Estrato I';$('tag').textContent=S.depth+' m';$('marketcoins').textContent=S.coins}function start(){if(!S){S=base();save()}$('menu').classList.remove('on');$('game').classList.add('on');view('mine')}function nav(){var x=[['mine','Mina','mine'],['bag','Mochila','bag'],['codex','Códice','book'],['miner','Minero','miner'],['menu','Menú','book']];$('nav').innerHTML=x.map(a=>'<button class="'+(S.active===a[0]?'active':'')+'" data-v="'+a[0]+'">'+ico(a[2])+a[1]+'</button>').join('');$('nav').onclick=e=>{var b=e.target.closest('button');if(b)view(b.dataset.v)}}function view(v){S.active=v;save();['bag','codex','miner','market'].forEach(x=>$(x).classList.remove('on'));if(v==='menu'){$('game').classList.remove('on');$('menu').classList.add('on');return}if(v==='mine')wall();if(v==='bag'){$('bag').classList.add('on');bagDraw()}if(v==='codex'){$('codex').classList.add('on');codexDraw()}if(v==='miner'){$('miner').classList.add('on');minerDraw()}if(v==='market'){$('market').classList.add('on');marketDraw()}hud();nav()}function wall(){var n=S.mine,w=$('wall');w.style.gridTemplateColumns='repeat('+n+',minmax(0,1fr))';w.style.gridTemplateRows='repeat('+n+',minmax(0,1fr))';w.innerHTML='';for(var i=0;i<n*n;i++){var k=i===0?'copper':i===n*n-1?'coal':Math.random()*100<S.prospect?(Math.random()<.55?'coal':'copper'):null,b=document.createElement('button');b.className='block';b.dataset.k=k||'';b.dataset.hp=k?O[k][4]:2;b.dataset.s=0;if(k){b.style.setProperty('--glow',O[k][2]);b.innerHTML='<i class="gem">'+svg(k)+'</i><i class="crack"></i>'}else b.innerHTML='<i class="crack"></i>';b.onclick=()=>hit(b);w.appendChild(b)}}function hit(b){if(load()>=cap())return;var k=b.dataset.k,h=k?O[k][4]:2,hp=+b.dataset.hp-S.pick-bonus('damage');b.dataset.hp=hp;var r=1-hp/h;b.dataset.s=r>.72?3:r>.4?2:r>.1?1:0;if(hp>0)return;if(k)S.bag[k]=(S.bag[k]||0)+1;else if(Math.random()*100<2+bonus('loot'))S.items.push(gear[Math.floor(Math.random()*gear.length)].slice());b.className='block empty';b.innerHTML='';if([...$('wall').children].every(x=>x.classList.contains('empty'))){S.depth++;setTimeout(wall,600)}save();hud()}function card(k,n){var m=O[k];return'<div class="card" style="--c:'+m[1]+'"><div class="minicon">'+svg(k)+'</div><div class="name">'+m[0]+'<small>'+n+' unidades · '+m[3]+' monedas/u.</small></div><div class="value">'+n*m[3]+'</div></div>'}function bagDraw(){var u=load(),r=Object.keys(O).filter(k=>S.bag[k]).map(k=>card(k,S.bag[k])).join('');$('bagbody').innerHTML='<div class="cap"><b>'+u+' / '+cap()+' espacios</b><div class="bar"><i style="width:'+(u/cap()*100)+'%"></i></div></div>'+(r||'<div class="empty">La mochila está vacía.</div>')}function codexDraw(){$('codexbody').innerHTML=Object.keys(O).map(k=>card(k,S.bag[k]||0)).join('')+'<div class="hero"><h3>Rarezas</h3><p>Común · Raro · Épico · Legendario</p></div>'}function minerDraw(){var slots=['casco','pico','traje','botas','talismán'];var s='<svg class="miner" viewBox="0 0 150 170"><ellipse cx="75" cy="162" rx="48" ry="6" fill="#000"/><path d="M43 67q-4-45 32-47 36 2 32 47" fill="#9c6138" stroke="#e0b45f" stroke-width="5"/><path d="M46 70h58l-6 13H52z" fill="#62402c"/><path d="M53 83q2 40 22 43 20-3 22-43" fill="#8da2a1" stroke="#26383e" stroke-width="5"/><path d="M42 126l25-10h16l25 10 14 34-25 6-7-25v27H60v-27l-7 25-25-6z" fill="#233d47" stroke="#60808a" stroke-width="4"/><path d="M61 166v-29m28 29v-29" stroke="#334b50" stroke-width="14"/><path d="M47 167h30m26 0h-30" stroke="#aa7848" stroke-width="8" stroke-linecap="round"/></svg><div class="slots">'+slots.map(q=>{var i=S.equip[q],c=i?colors[i[2]]:'#657177';return'<div class="slot" style="--r:'+c+'"><h3>'+q.toUpperCase()+'</h3><small>'+(i?i[1]:'Vacío')+'</small></div>'}).join('')+'</div><h3>Equipo encontrado</h3>'+S.items.map((i,n)=>'<div class="item" style="--r:'+colors[i[2]]+'"><b>'+i[1]+'</b> · '+i[2]+'<small>'+i[3]+'</small><button class="equip" data-e="'+n+'">EQUIPAR</button></div>').join('');$('minerbody').innerHTML=s||'<div class="empty">No has hallado equipo.</div>';$('minerbody').onclick=e=>{var b=e.target.closest('[data-e]');if(b){var n=+b.dataset.e,i=S.items[n];S.equip[i[0]]=i;S.items.splice(n,1);save();minerDraw();hud()}}}function marketDraw(){hud();document.querySelectorAll('[data-tab]').forEach(b=>{b.classList.toggle('active',b.dataset.tab===S.market);b.onclick=()=>{S.market=b.dataset.tab;save();marketDraw()}});var o=$('marketbody');if(S.market==='sell'){var r=Object.keys(O).filter(k=>S.bag[k]).map(k=>'<div class="mrow">'+card(k,S.bag[k])+'<button class="sell" data-s="'+k+'">VENDER</button></div>').join('');o.innerHTML='<div class="hero"><h3>Almacén de mineral</h3><p>Monedas: <b>'+S.coins+'</b></p><button id="sellall" class="sell" '+(!load()?'disabled':'')+'>VENDER TODO</button></div>'+(r||'<div class="empty">No tienes recursos.</div>');$('sellall').onclick=()=>{Object.keys(S.bag).forEach(k=>sell(k));marketDraw()};o.onclick=e=>{var b=e.target.closest('[data-s]');if(b){sell(b.dataset.s);marketDraw()}}}else if(S.market==='tools'){o.innerHTML=upgrade('Pico de hierro','pick','Daño actual: '+S.pick,25,'+1 daño')+upgrade('Mochila reforzada','baglvl','Capacidad: '+cap(),35,'+12 carga')+upgrade('Prospección de veta','prospect','Densidad: '+S.prospect+'%',50,'+5% menas')+upgrade('Ampliar galería','mine','Mina: '+S.mine+' × '+S.mine,90,'4×4 hasta 12×12');bindUp(o)}else o.innerHTML='<div class="hero"><h3>Taller de automatización</h3><p>Próximamente: mineros, carretillas, perforadoras y fundición.</p></div>'}function upgrade(n,k,d,b,e){var lv=k==='prospect'?(S.prospect-20)/5:k==='mine'?(S.mine-2)/2:S[k],c=b*Math.pow(2,lv-1),max=k==='prospect'&&S.prospect>=100||k==='mine'&&S.mine>=12;return'<article class="upgrade"><h3>'+n+'</h3><p>'+d+'</p><div class="uf"><span>'+e+'<br>Coste: '+(max?'MÁXIMO':c)+'</span><button class="buy" data-buy="'+k+'" data-cost="'+c+'" '+(max||S.coins<c?'disabled':'')+'>MEJORAR</button></div></article>'}function bindUp(o){o.onclick=e=>{var b=e.target.closest('[data-buy]');if(!b||b.disabled)return;var k=b.dataset.buy,c=+b.dataset.cost;if(S.coins<c)return;S.coins-=c;if(k==='prospect')S.prospect=Math.min(100,S.prospect+5);else if(k==='mine')S.mine=Math.min(12,S.mine+2);else S[k]++;save();marketDraw()}}function sell(k){S.coins+=S.bag[k]*O[k][3]*(1+bonus('value')/100);delete S.bag[k];save();hud()}function modal(t,p,buttons){$('dialog').innerHTML='<h3>'+t+'</h3><p>'+p+'</p><div class="actions">'+buttons+'</div>';$('modal').classList.add('on')}function boot(){$('continue').textContent=S?'CONTINUAR PARTIDA':'COMENZAR EXPEDICIÓN';$('continue').onclick=start;$('dock').onclick=()=>view('market');$('new').onclick=()=>modal('Nueva expedición','Se borrarán monedas, mochila, mejoras y equipo.','<button id="no">CANCELAR</button><button id="yes" class="danger">BORRAR Y EMPEZAR</button>');$('settings').onclick=()=>modal('Ajustes','Guardado automático activo.','<button id="close">CERRAR</button>');$('credits').onclick=()=>modal('Créditos','Las Profundidades de Hierro · v10.0','<button id="close">CERRAR</button>');$('modal').onclick=e=>{if(e.target.id==='no'||e.target.id==='close')$('modal').classList.remove('on');if(e.target.id==='yes'){S=base();save();$('modal').classList.remove('on');start()}}}document.addEventListener('DOMContentLoaded',boot)})();</script></body></html>
