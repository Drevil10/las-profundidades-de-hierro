<!doctype html><meta name=viewport content='width=device-width,initial-scale=1'><title>Las Profundidades de Hierro</title><style>body{margin:0;background:#071015;color:#eee;font:16px Georgia;text-align:center}main{max-width:600px;margin:auto;min-height:100vh;background:radial-gradient(#33464c,#071015);padding:20px;box-sizing:border-box}button{padding:13px;margin:5px;background:#27454a;border:1px solid #e5ae55;color:#fff;border-radius:6px;font-weight:bold}#rock{width:250px;margin:35px auto;display:block;filter:drop-shadow(0 12px 10px #000)}.ore{fill:#d87851}.lite{fill:#ffdf9a}#bar{height:12px;background:#d87851;width:100%;transition:.1s}.box{background:#102027;border:1px solid #527078;padding:12px;margin:9px;border-radius:7px}small{color:#b7c4be}</style><main><h1>LAS PROFUNDIDADES<br><small>DE HIERRO · v1</small></h1><div class=box>⛏ Mineral: <b id=o>0</b> · ✦ Monedas: <b id=c>0</b></div><p id=layer>Estrato 1 · Veta de cobre</p><svg id=rock viewBox='0 0 200 170'><path fill='#26383e' stroke='#789' stroke-width='4' d='M15 120 30 45 80 20l45 20 45-10 20 70-35 45-75 20z'/><g class=ore><path d='m45 90 22-22 20 22-20 22z'/><path d='m110 65 20-20 24 22-22 23z'/><path d='m115 120 22-18 20 22-20 20z'/></g><g class=lite><circle cx=66 cy=87 r=6/><circle cx=132 cy=66 r=6/><circle cx=136 cy=120 r=6/></g></svg><button id=mine>MINAR LA VETA</button><div class=box>Integridad<div style='background:#061015'><div id=bar></div></div><span id=h>40 / 40</span></div><button id=sell>VENDER MINERAL</button><button id=up>PICO REFORZADO · <span id=p>20</span> ✦</button><button id=worker>CONTRATAR MINERO · <span id=w>50</span> ✦</button><p><small id=auto>Minero automático: 0 / s</small></p></main><script>let s=JSON.parse(localStorage.mine||'{"o":0,"c":0,"hp":40,"m":40,"pick":1,"work":0,"l":1}'),$=x=>document.getElementById(x);function draw(){$('o').textContent=s.o;$('c').textContent=s.c;$('h').textContent=s.hp+' / '+s.m;$('bar').style.width=s.hp/s.m*100+'%';$('p').textContent=20*s.pick;$('w').textContent=50*(s.work+1);$('auto').textContent='Minero automático: '+s.work+' / s';$('layer').textContent='Estrato '+s.l+' · Veta de '+['cobre','hierro','oro'][Math.min(2,s.l-1)];localStorage.mine=JSON.stringify(s)}$('mine').onclick=()=>{let n=s.pick;s.o+=n;s.hp-=n;if(s.hp<=0){s.l++;s.m+=30;s.hp=s.m}draw()};$('sell').onclick=()=>{s.c+=s.o*s.l;s.o=0;draw()};$('up').onclick=()=>{let n=20*s.pick;if(s.c>=n){s.c-=n;s.pick++;draw()}};$('worker').onclick=()=>{let n=50*(s.work+1);if(s.c>=n){s.c-=n;s.work++;draw()}};setInterval(()=>{if(s.work){s.o+=s.work;draw()}},1000);draw()</script>
